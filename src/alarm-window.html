<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuruTime Alarm</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #c33f31;
      --accent-2: #4f9d92;
      --accent-grad: linear-gradient(135deg, #c33f31 0%, #d4674a 46%, #4f9d92 100%);
      --glow: rgba(195, 63, 49, 0.40);
      --aurora-1: rgba(196, 66, 52, 0.28);
      --aurora-2: rgba(202, 108, 64, 0.24);
      --aurora-3: rgba(84, 148, 138, 0.22);
      --surface: rgba(255, 250, 246, 0.58);
      --surface-solid: #fbf4ec;
      --surface-muted: rgba(255, 250, 246, 0.42);
      --line: rgba(36, 22, 24, 0.12);
      --line-strong: rgba(36, 22, 24, 0.21);
      --ink: #18161d;
      --ink-soft: #575360;
      --ink-faint: #857f8e;
      --focus: #c33f31;
      --danger: #b62f2a;
      --radius-panel: 24px;
      --radius-control: 13px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px;
    }

    button {
      font: inherit;
      -webkit-app-region: no-drag;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .alarm-panel {
      position: relative;
      width: min(420px, calc(100vw - 20px));
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-panel);
      background: var(--surface);
      -webkit-backdrop-filter: blur(30px) saturate(175%);
      backdrop-filter: blur(30px) saturate(175%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 30px 80px rgba(28, 20, 60, 0.32);
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: panel-enter 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* aurora glow bleeding through the frosted glass */
    .alarm-panel::after {
      content: "";
      position: absolute;
      inset: -40%;
      z-index: 0;
      background:
        radial-gradient(36% 40% at 20% 18%, var(--aurora-1), transparent 62%),
        radial-gradient(40% 42% at 88% 20%, var(--aurora-2), transparent 62%),
        radial-gradient(46% 48% at 76% 92%, var(--aurora-3), transparent 62%);
      filter: blur(20px);
      animation: aurora-drift 24s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .alarm-panel::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 1;
      width: 6px;
      background: var(--accent-grad);
      box-shadow: 0 0 20px -2px var(--glow);
    }

    .alarm-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 20px;
      padding: 22px 22px 22px 26px;
    }

    @keyframes aurora-drift {
      0%   { transform: translate3d(-3%, -2%, 0) rotate(0deg) scale(1.05); }
      50%  { transform: translate3d(3%, 2%, 0) rotate(6deg) scale(1.12); }
      100% { transform: translate3d(4%, 3%, 0) rotate(-4deg) scale(1.08); }
    }

    .alarm-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 16px;
    }

    .alarm-copy {
      min-width: 0;
    }

    .alarm-kind {
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .alarm-title {
      max-width: 15ch;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: clamp(27px, 8vw, 36px);
      font-weight: 800;
      letter-spacing: -1.1px;
      line-height: 1.06;
    }

    .alarm-description {
      margin-top: 9px;
      max-width: 34ch;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }

    .hide-button {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-muted);
      color: var(--ink-soft);
      cursor: pointer;
      padding: 0 10px;
      font-size: 11.5px;
      font-weight: 660;
      white-space: nowrap;
      transition: transform 100ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    .hide-button:hover {
      border-color: var(--line-strong);
      background: rgba(24, 29, 38, 0.09);
      color: var(--ink);
    }

    .alarm-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-item {
      min-height: 55px;
      display: grid;
      align-content: center;
      gap: 3px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: var(--surface-muted);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      padding: 9px 11px;
    }

    .meta-label {
      color: var(--ink-faint);
      font-size: 10.5px;
      font-weight: 620;
      line-height: 1.2;
    }

    .meta-value {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 680;
      line-height: 1.3;
    }

    .snooze-section {
      display: grid;
      gap: 9px;
    }

    .section-label {
      color: var(--ink);
      font-size: 12px;
      font-weight: 680;
      line-height: 1.3;
    }

    .snooze-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .snooze-button,
    .action-button {
      border-radius: var(--radius-control);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 100ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease, opacity 120ms ease;
    }

    .snooze-button {
      height: 38px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .snooze-button:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      box-shadow: 0 6px 18px -8px var(--glow);
      color: var(--ink);
    }

    .primary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-button {
      min-height: 43px;
      border: 1px solid transparent;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .action-button.dismiss {
      border-color: transparent;
      background: var(--accent-grad);
      background-size: 160% 160%;
      box-shadow: 0 12px 28px -10px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .action-button.dismiss:hover {
      background-position: 100% 50%;
      box-shadow: 0 16px 34px -10px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    .action-button.complete {
      border-color: var(--line);
      background: var(--surface-muted);
      color: var(--ink);
    }

    .action-button.complete:hover {
      border-color: var(--line-strong);
      background: rgba(24, 29, 38, 0.1);
    }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent);
      outline-offset: 2px;
    }

    button:active {
      transform: translateY(1px) scale(0.985);
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
      transform: none;
    }

    .action-status {
      min-height: 16px;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    @keyframes panel-enter {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #ec6b52;
        --accent-2: #5cc0b2;
        --accent-grad: linear-gradient(135deg, #ec6b52 0%, #e88a63 46%, #5cc0b2 100%);
        --glow: rgba(236, 107, 82, 0.50);
        --aurora-1: rgba(226, 88, 66, 0.40);
        --aurora-2: rgba(216, 126, 74, 0.28);
        --aurora-3: rgba(88, 168, 156, 0.28);
        --surface: rgba(52, 40, 34, 0.5);
        --surface-solid: #251a14;
        --surface-muted: rgba(255, 238, 224, 0.06);
        --line: rgba(255, 232, 224, 0.11);
        --line-strong: rgba(255, 232, 224, 0.22);
        --ink: #f6f5fb;
        --ink-soft: #c4c0cc;
        --ink-faint: #948f9e;
        --focus: #f27e67;
        --danger: #f2887a;
      }

      .alarm-panel {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 30px 80px rgba(0, 0, 0, 0.6);
      }

      .action-button.dismiss { color: #0c0d18; }

      .hide-button:hover,
      .action-button.complete:hover {
        background: rgba(255, 255, 255, 0.12);
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 6px;
      }

      .alarm-content {
        gap: 16px;
        padding: 18px 16px 18px 20px;
      }

      .alarm-meta,
      .primary-actions {
        grid-template-columns: 1fr;
      }

      .snooze-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .alarm-panel {
        background: var(--surface-solid);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      .alarm-panel::after { display: none; }

      .meta-item {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --line: rgba(0, 0, 0, 0.48);
        --line-strong: rgba(0, 0, 0, 0.72);
        --ink-soft: #303844;
        --ink-faint: #47515f;
      }

      .alarm-panel,
      .hide-button,
      .meta-item,
      .snooze-button,
      .action-button {
        border-width: 2px;
      }
    }

    @media (prefers-color-scheme: dark) and (prefers-contrast: more) {
      :root {
        --line: rgba(255, 255, 255, 0.5);
        --line-strong: rgba(255, 255, 255, 0.74);
        --ink-soft: #e0e4ea;
        --ink-faint: #c5cbd3;
      }
    }

    @media (forced-colors: active) {
      .alarm-panel,
      .hide-button,
      .meta-item,
      .snooze-button,
      .action-button {
        border: 2px solid CanvasText;
        forced-color-adjust: auto;
      }
    }
  </style>
</head>
<body>
  <main class="alarm-panel" id="alarmPanel" role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle" aria-describedby="alarmDescription alarmStatus" tabindex="-1">
    <div class="alarm-content">
      <header class="alarm-header">
        <div class="alarm-copy">
          <p class="alarm-kind">Alarm</p>
          <h1 class="alarm-title" id="alarmTitle">Alarm hazırlanıyor</h1>
          <p class="alarm-description" id="alarmDescription">Alarm bilgisi bekleniyor.</p>
        </div>
        <button class="hide-button" id="hideButton" type="button" aria-label="Alarm penceresini gizle">Gizle</button>
      </header>

      <div class="alarm-meta" aria-label="Alarm bilgileri">
        <div class="meta-item">
          <span class="meta-label">Zaman</span>
          <span class="meta-value" id="latenessText">Tam zamanında</span>
        </div>
        <div class="meta-item" id="queueItem">
          <span class="meta-label">Sıra</span>
          <span class="meta-value" id="queueText">Başka alarm yok</span>
        </div>
      </div>

      <section class="snooze-section" aria-labelledby="snoozeLabel">
        <h2 class="section-label" id="snoozeLabel">Ertele</h2>
        <div class="snooze-options" id="snoozeOptions" role="group" aria-labelledby="snoozeLabel">
          <button class="snooze-button" type="button" data-snooze="5" disabled>5 dk</button>
          <button class="snooze-button" type="button" data-snooze="10" disabled>10 dk</button>
          <button class="snooze-button" type="button" data-snooze="15" disabled>15 dk</button>
          <button class="snooze-button" type="button" data-snooze="30" disabled>30 dk</button>
        </div>
      </section>

      <div class="primary-actions">
        <button class="action-button dismiss" id="dismissButton" type="button" disabled>Tamam</button>
        <button class="action-button complete" id="completeButton" type="button" disabled>Görevi bitir</button>
      </div>

      <p class="action-status" id="alarmStatus" role="status" aria-live="polite"></p>
    </div>
  </main>

  <p class="sr-only" id="alarmLive" aria-live="assertive" aria-atomic="true"></p>
  <script src="alarm-window.js"></script>
</body>
</html>
