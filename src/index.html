<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>GuruTime</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app" id="app">
    <div class="particles" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">
          <span class="brand-mark-glow" aria-hidden="true"></span>
          <svg class="brand-mark-svg" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="gt-mark-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0594a"/><stop offset="1" stop-color="#b5332a"/></linearGradient>
              <linearGradient id="gt-mark-sweep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.55)"/><stop offset="0.5" stop-color="rgba(255,255,255,0)"/></linearGradient>
            </defs>
            <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#gt-mark-red)"/>
            <g class="brand-mark-sweep"><path d="M24 6 A18 18 0 0 1 42 24" fill="none" stroke="url(#gt-mark-sweep)" stroke-width="5" stroke-linecap="round"/></g>
            <path d="M34 24a10.6 10.6 0 1 1-3.6-7.9" fill="none" stroke="#fbf4ec" stroke-width="6" stroke-linecap="round"/>
            <rect x="23" y="20.6" width="16" height="6.8" rx="3.4" fill="#2f8f83"/>
            <rect x="9" y="9" width="30" height="30" rx="9" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.4"/>
          </svg>
        </span>
        <div>
          <h1 class="wordmark">GuruTime</h1>
          <p id="headerStatus">Yerel ve hazır</p>
        </div>
      </div>
      <button class="icon-button" id="quitButton" type="button" aria-label="GuruTime'dan çık" title="Çık">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9V6.4A2.4 2.4 0 1 0 6.6 9H9zm0 0v6m0-6h6M9 15v2.6A2.4 2.4 0 1 1 6.6 15H9zm6 0h2.4A2.4 2.4 0 1 1 15 17.6V15zm0 0V9m0 6h-6m6-6V6.4A2.4 2.4 0 1 1 17.4 9H15z"/></svg>
      </button>
    </header>

    <nav class="tabs" aria-label="GuruTime bölümleri" role="tablist">
      <span class="tab-pill" aria-hidden="true"></span>
      <button class="tab active" id="tasksTab" type="button" role="tab" aria-selected="true" data-tab="tasks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 5.4l1 1 1.8-1.8"/><path d="M4 11.4l1 1 1.8-1.8"/><path d="M4 17.4l1 1 1.8-1.8"/></svg>
        <span>Görevler</span>
      </button>
      <button class="tab" id="connectionsTab" type="button" role="tab" aria-selected="false" data-tab="connections">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M8.7 8.7a4.6 4.6 0 0 0 0 6.6"/><path d="M15.3 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M6.1 6.1a8.2 8.2 0 0 0 0 11.8"/><path d="M17.9 6.1a8.2 8.2 0 0 1 0 11.8"/></svg>
        <span>Bağlantı</span>
      </button>
      <button class="tab" id="settingsTab" type="button" role="tab" aria-selected="false" data-tab="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16"/><path d="M4 16h16"/><circle cx="9" cy="8" r="2.6" fill="var(--bg-base)"/><circle cx="15" cy="16" r="2.6" fill="var(--bg-base)"/></svg>
        <span>Ayarlar</span>
      </button>
    </nav>

    <main class="content" id="content" tabindex="-1"></main>

    <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>

    <form class="quick-add" id="quickAddForm" autocomplete="off">
      <label class="sr-only" for="quickAddInput">Yeni görev</label>
      <select id="quickAddCategory" aria-label="Görev kategorisi">
        <option value="today">Bugün</option>
        <option value="important">Önemli</option>
        <option value="later">Bir Ara</option>
      </select>
      <input id="quickAddInput" maxlength="240" placeholder="Yeni görev ekle" required>
      <button class="primary compact" type="submit">Ekle</button>
    </form>

    <footer class="footer">
      <span id="taskCount">0 açık görev</span>
      <span>Veriler bu Mac'te</span>
    </footer>
  </div>

  <dialog class="modal" id="alarmDialog" aria-labelledby="alarmDialogTitle">
    <form method="dialog" id="alarmForm">
      <div class="modal-heading">
        <div>
          <span class="eyebrow">Hatırlatıcı</span>
          <h2 id="alarmDialogTitle">Alarm ayarla</h2>
        </div>
        <button class="close-button" type="button" data-close="alarmDialog" aria-label="Kapat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="modal-task" id="alarmTaskTitle"></p>
      <label for="alarmMinutes">Ne kadar sonra?</label>
      <div class="duration-input">
        <input id="alarmMinutes" type="number" min="1" max="1440" step="1" value="10" required>
        <span>dakika</span>
      </div>
      <div class="duration-presets" aria-label="Hızlı süre seçimi">
        <button type="button" data-minutes="5">5 dk</button>
        <button type="button" data-minutes="10">10 dk</button>
        <button type="button" data-minutes="30">30 dk</button>
        <button type="button" data-minutes="60">1 saat</button>
      </div>
      <p class="form-error" id="alarmError" role="alert"></p>
      <div class="modal-actions">
        <button class="secondary" type="button" data-close="alarmDialog">Vazgeç</button>
        <button class="primary" type="submit">Alarmı kur</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal pairing-modal" id="pairingDialog" aria-labelledby="pairingTitle">
    <div class="modal-heading">
      <div>
        <span class="eyebrow">Tek kullanımlık</span>
        <h2 id="pairingTitle">Telefonu eşleştir</h2>
      </div>
      <button class="close-button" type="button" data-close="pairingDialog" aria-label="Kapat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="qr-frame" id="qrFrame">
      <img id="qrImage" width="220" height="220" alt="Telefon eşleştirme QR kodu">
    </div>
    <p class="pairing-help">Kodu telefonunuzla tarayın. Eşleştirme anahtarı buluta gönderilmez ve 10 dakika sonra geçersiz olur.</p>
    <div class="pin-row" id="pairingPinRow" hidden>
      <span>Paylaşım PIN'i</span>
      <strong id="pairingPin"></strong>
    </div>
    <p class="form-error" id="pairingError" role="alert"></p>
  </dialog>

  <div class="lock-screen" id="lockScreen" hidden>
    <form class="lock-card" id="unlockForm">
      <svg class="lock-mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#gt-mark-red)"/>
        <path d="M34 24a10.6 10.6 0 1 1-3.6-7.9" fill="none" stroke="#fbf4ec" stroke-width="6" stroke-linecap="round"/>
        <rect x="23" y="20.6" width="16" height="6.8" rx="3.4" fill="#2f8f83"/>
        <rect x="9" y="9" width="30" height="30" rx="9" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.4"/>
      </svg>
      <div>
        <span class="eyebrow">Yerel gizlilik kilidi</span>
        <h2>GuruTime kilitli</h2>
      </div>
      <label for="unlockPassword">Parola</label>
      <input id="unlockPassword" type="password" autocomplete="current-password" required>
      <p class="form-error" id="unlockError" role="alert"></p>
      <button class="primary" type="submit">Kilidi aç</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="index.js"></script>
</body>
</html>
