<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>GuruTime Yerel</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fa; --panel:#fff; --text:#17202d; --muted:#697586; --line:rgba(23,32,45,.13); --accent:#3f78d8; --danger:#be4d55; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
    @media(prefers-color-scheme:dark){:root{--bg:#171b22;--panel:#232933;--text:#f3f5f8;--muted:#aab4c2;--line:rgba(243,245,248,.14);--accent:#78a7f2;--danger:#ee858c}}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);padding:calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));font-size:15px} main{max-width:560px;margin:auto} header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px} h1{font-size:24px;margin:0} header p{margin:3px 0 0;color:var(--muted);font-size:12px}.status{width:10px;height:10px;border-radius:50%;background:var(--muted)}.status.online{background:#39a876}.panel{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden;margin-bottom:12px}.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px}input,button,select{font:inherit}input,select{height:43px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:0 11px}button{min-height:40px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);font-weight:680;padding:0 12px}button.primary{border-color:var(--accent);background:var(--accent);color:#fff}.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px}.task+.task{border-top:1px solid var(--line)}.task.done .title{text-decoration:line-through;color:var(--muted)}.check{width:25px;height:25px;min-height:0;padding:0}.title{overflow-wrap:anywhere;font-weight:620}.meta{display:block;color:var(--muted);font-size:11px;margin-top:2px}.actions{display:flex;gap:4px}.actions button{min-height:31px;padding:0 8px;font-size:11px}.danger{color:var(--danger)}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.notice{padding:14px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));font-size:13px;line-height:1.5}.error{color:var(--danger)}dialog{width:min(340px,calc(100% - 28px));border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);padding:16px}dialog::backdrop{background:rgba(0,0,0,.5)}dialog h2{margin:0 0 6px;font-size:19px}dialog p{margin:0 0 13px;color:var(--muted)}dialog label{display:block;margin-bottom:5px;font-size:12px;font-weight:680}dialog input{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>GuruTime</h1><p>Bu Mac ile yerel bağlantı</p></div>
      <span class="status" id="status" aria-label="Bağlantı durumu"></span>
    </header>
    <section class="panel" id="pairingPanel"><div class="notice" id="pairingNotice">Güvenli eşleştirme doğrulanıyor.</div></section>
    <form class="panel add" id="addForm" hidden>
      <label for="title" style="position:absolute;clip:rect(0,0,0,0)">Yeni görev</label>
      <input id="title" maxlength="240" placeholder="Yeni görev" required>
      <button class="primary" type="submit">Ekle</button>
    </form>
    <section class="panel" id="tasks" hidden></section>
  </main>
  <dialog id="alarmDialog">
    <form id="alarmForm" method="dialog">
      <h2>Alarm ayarla</h2>
      <p id="alarmTitle"></p>
      <label for="minutes">Dakika</label>
      <input id="minutes" type="number" min="1" max="1440" value="10" required>
      <div class="dialog-actions">
        <button type="button" id="cancelAlarm">Vazgeç</button>
        <button class="primary" type="submit">Kur</button>
      </div>
    </form>
  </dialog>
  <script src="/mobile-control.js"></script>
</body>
</html>
